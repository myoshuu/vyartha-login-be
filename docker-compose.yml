services:
  login-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vyartha-login-backend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - dokploy网络

  nginx:
    image: nginx:alpine
    container_name: vyartha-login-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - login-backend
    networks:
      - dokploy网络

networks:
  dokploy网络:
    external: true
